<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모바일 청첩장</title>

    <!-- Open Graph / Facebook / KakaoTalk -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://jd-commit-us.github.io/wedding-firstpage/">
    <meta property="og:title" content="재석 ♥ 동희의 모바일 청첩장">
    <meta property="og:description" content="2027년 1월 30일 토요일 AM 11시 | 소사 MJ 컨벤션 | 영원히 함께할 사랑의 맹세, 같이 축복해주세요">
    <meta property="og:image"
        content="https://raw.githubusercontent.com/jd-commit-us/wedding-firstpage/main/local/images/og/thumbnail.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:locale" content="ko_KR">
    <meta property="og:site_name" content="재석 ♥ 동희 결혼식">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://jd-commit-us.github.io/wedding-firstpage/">
    <meta name="twitter:title" content="재석 ♥ 동희 모바일 청첩장">
    <meta name="twitter:description" content="2027년 1월 30일 토요일 AM 11시 | 소사 MJ 컨벤션 | 영원히 함께할 사랑의 맹세, 같이 축복해주세요">
    <meta name="twitter:image"
        content="https://raw.githubusercontent.com/jd-commit-us/wedding-firstpage/main/local/images/og/thumbnail.png">

    <!-- Additional Meta Tags -->
    <meta name="description" content="2027년 1월 30일 토요일 AM 11시 | 소사 MJ 컨벤션 | 이재석과 임동희의 결혼식에 초대합니다">
    <meta name="keywords" content="결혼식, 청첩장, 모바일청첩장, 이재석, 임동희, 소사 MJ 컨벤션">
    <meta name="author" content="이재석, 임동희">
    <meta name="theme-color" content="#b8d5f2">
    
    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Noto+Sans+KR:wght@300;400;500&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./local/js/crypto-util.js"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.0/kakao.min.js"
        integrity="sha384-l6I7YpLAnpS8mXdfzD4pUnVqB3kS+Yn0yW4I3oR6K7CizK6G/h6y3J3LzW9p+G2J"
        crossorigin="anonymous"></script>

    <!-- SunEditor CSS for Rich Text Rendering -->
    <link href="https://cdn.jsdelivr.net/npm/suneditor@latest/dist/css/suneditor.min.css" rel="stylesheet">

    <style>
        :root {
            --accent: #93c5fd;
            --accent-soft: #e0f2fe;
            --text: #334155;
        }

        .eng-font {
            font-family: 'Great Vibes', cursive;
        }

        .lux-font {
            font-family: 'Nanum Myeongjo', serif;
        }

        [x-cloak] {
            display: none !important;
        }

        /* Intro */
        #intro-layer {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(4px);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
            transition: opacity 1s;
        }

        .scroll-icon {
            border: 2px solid rgba(255, 255, 255, 0.9);
            width: 30px;
            height: 50px;
            border-radius: 15px;
            position: relative;
        }

        .scroll-icon::after {
            content: '';
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 8px;
            background: white;
            border-radius: 2px;
            animation: scrollDown 1.5s infinite;
        }

        @keyframes scrollDown {
            0% {
                top: 8px;
                opacity: 1;
            }

            100% {
                top: 25px;
                opacity: 0;
            }
        }

        /* Effects */
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 50;
            width: 100vw;
            height: 100vh;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .max-w-lg {
                width: 100%;
                border-radius: 0;
            }

            .section-wrap {
                box-shadow: none;
                border-bottom: 1px solid #f1f5f9;
            }
        }

        /* Layout */
        .section-wrap {
            opacity: 0;
            transform: translateY(50px);
            transition: 1s cubic-bezier(0.2, 1, 0.3, 1);
            margin-bottom: 2px;
            background: white;
            box-shadow: 0 4px 20px rgba(148, 163, 184, 0.08);
        }

        .section-wrap.active {
            opacity: 1;
            transform: translateY(0);
        }

        .content-body {
            transition: max-height 0.8s ease-in-out;
            overflow: hidden;
            max-height: 3000px;
        }

        .content-body.folded {
            max-height: 0;
        }

        /* Gallery Grid */
        .gal-grid-item {
            aspect-ratio: 1;
            background-size: cover;
            background-position: center;
            border: 1px solid #e2e8f0;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .gal-grid-item:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(148, 163, 184, 0.25);
        }

        .gal-main {
            width: 100%;
            aspect-ratio: 3/4;
            background-size: contain;
            background-color: #0f172a;
            background-repeat: no-repeat;
            background-position: center;
            transition: opacity 0.8s ease-in-out, background-image 0.8s ease-in-out;
            position: relative;
            cursor: pointer;
        }

        .gal-main::after {
            content: '';
            position: absolute;
            inset: 10px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            pointer-events: none;
        }

        /* Guestbook Scrollbar */
        .guestbook-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .guestbook-scroll::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>

<body x-data="app()" x-init="init()" class="relative text-center bg-[#f8fafc]"
    :style="`font-size: ${data.theme?.style?.fontSize || '14px'}; line-height: ${data.theme?.style?.lineHeight || '1.8'}; letter-spacing: ${data.theme?.style?.letterSpacing || '0px'}`"
    @mousemove="handleMouseMove($event)" @mousedown="handleMouseDown($event)" @touchstart="handleTouchStart($event)">

    <!-- Intro Layer -->
    <div id="intro-layer" x-show="showIntro" @click="closeIntro" @wheel.prevent="closeIntro"
        @touchmove.prevent="closeIntro">
        <div class="text-3xl eng-font mb-4 tracking-wider text-sky-100 animate-pulse">Our Winter Wedding</div>
        <div class="scroll-icon mb-4"></div>
        <div class="text-xs tracking-widest text-sky-200/80">SCROLL DOWN</div>
    </div>

    <!-- Floating Nav -->
    <div class="fixed top-4 left-4 z-[90] flex flex-col gap-2 transition-all duration-300"
        :class="showIntro?'opacity-0':'opacity-100'">
        <button x-show="data.media && data.media.bgm && data.media.bgm.length > 0" @click="toggleBgm"
            class="w-10 h-10 rounded-full bg-white/80 backdrop-blur shadow-md border border-sky-100 flex items-center justify-center animate-[spin_4s_linear_infinite]"
            :style="bgmPlaying ? '' : 'animation: none'">
            ❄️
        </button>
    </div>

    <!-- Snow Effect Canvas -->
    <canvas id="effect"></canvas>

    <!-- Main Content -->
    <main class="pb-32 w-full">
        <template x-for="section in sortedSections" :key="section.id">
            <template x-if="section.isVisible">
                <div class="section-wrap relative" :id="section.id"
                    :class="section.id === 'names' ? 'pt-0 w-full mb-0 shadow-none' : 'max-w-lg mx-auto'">

                    <!-- 헤더 영역 (hero, greeting, names 숨김) -->
                    <div x-show="!['names', 'hero', 'greeting'].includes(section.id)"
                        @click="if(section._canFold) section._isFolded = !section._isFolded"
                        class="p-6 flex justify-between items-center bg-white z-10 relative"
                        :class="section._canFold ? 'cursor-pointer' : ''">
                        <h2 class="text-lg lux-font font-bold text-slate-700 tracking-wide"
                            x-text="t(section.id) === section.id ? section.title : t(section.id)"></h2>
                        <span x-show="section._canFold" class="text-slate-400 text-xs"
                            x-text="section._isFolded ? '▼' : '▲'"></span>
                    </div>

                    <!-- Body -->
                    <div class="content-body" :class="section._isFolded ? 'folded' : ''">                    
                        <!-- 1. 메인 배너 사진 (hero) -->
                        <template x-if="section.id === 'hero'">
                            <section class="relative w-full overflow-hidden bg-slate-900 h-[75vh]">
                                <img :src="data.images?.main" class="w-full h-full object-cover block shadow-inner">                                
                            </section>
                        </template>
                        
                        <!-- 2. 초대 인사말 (Greeting) -->
                        <template x-if="section.id === 'greeting'">
                            <section class="w-full py-20 px-6 bg-[#fbfdff] border-b border-sky-50">
                                <div class="max-w-md mx-auto text-center">
                                    <div class="mb-10 flex flex-col items-center">
                                        <span class="font-serif italic text-2xl text-sky-800/80 tracking-wide select-none">
                                            Invitation
                                        </span>
                                        <div class="w-1.5 h-1.5 rounded-full bg-sky-300 mt-3"></div>
                                    </div>

                                    <div class="text-[13.5px] leading-[2.2] text-slate-700 font-light break-keep px-4 sun-editor-common"
                                        :style="`font-size: ${data.theme?.style?.fontSize || '14px'}; line-height: ${data.theme?.style?.lineHeight || '2.1'}; letter-spacing: ${data.theme?.style?.letterSpacing || '-0.02em'}; text-align: ${data.theme?.style?.textAlign || 'center'};`"
                                        x-html="data.text?.mainMessage">
                                    </div>
                                </div>
                            </section>
                        </template>

                        <!-- 3. 신랑 · 신부 성함 (names) -->
                        <template x-if="section.id === 'names'">
                            <section class="w-full py-16 px-6 bg-white border-b border-slate-100">
                                <div class="max-w-lg mx-auto flex justify-center">
                                    <div class="grid grid-cols-[1fr_auto_1fr] items-center gap-x-6 sm:gap-x-12 text-center">
                                        <!-- 신랑측 -->
                                        <div class="flex flex-col items-center min-w-[110px]">
                                            <div class="text-[12px] text-slate-500 mb-3 lux-font whitespace-nowrap">
                                                <span x-text="data.groom?.parents?.father"></span> · <span x-text="data.groom?.parents?.mother"></span>의 
                                                <span class="text-slate-600 font-medium" x-text="data.groom?.rank"></span>
                                            </div>
                                            <div class="flex flex-col items-center">
                                                <span class="text-sm text-sky-600 font-bold mb-1 lux-font">신랑</span>
                                                <h1 class="text-2xl sm:text-3xl tracking-[0.15em] font-light lux-font text-slate-800"
                                                    x-text="data.groom?.name"></h1>
                                            </div>
                                        </div>

                                        <!-- 구분 기호 -->
                                        <div class="lux-font text-2xl text-sky-200 self-center pb-2">&</div>

                                        <!-- 신부측 -->
                                        <div class="flex flex-col items-center min-w-[110px]">
                                            <div class="text-[12px] text-slate-500 mb-3 lux-font whitespace-nowrap">
                                                <span x-text="data.bride?.parents?.father"></span> · <span x-text="data.bride?.parents?.mother"></span>의 
                                                <span class="text-slate-600 font-medium" x-text="data.bride?.rank"></span>
                                            </div>
                                            <div class="flex flex-col items-center">
                                                <span class="text-sm text-sky-500 font-bold mb-1 lux-font">신부</span>
                                                <h1 class="text-2xl sm:text-3xl tracking-[0.15em] font-light lux-font text-slate-800"
                                                    x-text="data.bride?.name"></h1>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </section>
                        </template>

                        <!-- 4. Calendar & D-Day Countdown -->
                        <template x-if="section.id === 'calendar'">
                            <div class="px-8 pb-12 text-center" 
                                x-data="{
                                    days: '0', hours: '00', minutes: '00', seconds: '00', dDayText: '',
                                    initTimer() {
                                        const update = () => {
                                            const rawDate = (this.data && this.data.config && this.data.config.weddingDate) || '2027-01-30T11:00:00';
                                            const safeDateStr = String(rawDate).replace(' ', 'T');
                                            const target = new Date(safeDateStr).getTime();
                                            const now = new Date().getTime();
                                            const diff = target - now;

                                            if (!isNaN(diff) && diff > 0) {
                                                const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                                                const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                                                const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                                                const s = Math.floor((diff % (1000 * 60)) / 1000);

                                                this.days = String(d);
                                                this.hours = String(h).padStart(2, '0');
                                                this.minutes = String(m).padStart(2, '0');
                                                this.seconds = String(s).padStart(2, '0');
                                                this.dDayText = `결혼식이 ${d}일 남았습니다.`;
                                            } else if (diff <= 0) {
                                                this.days = '0';
                                                this.hours = '00';
                                                this.minutes = '00';
                                                this.seconds = '00';
                                                this.dDayText = '오늘 우리의 결혼식이 시작됩니다! ❄️';
                                            }
                                        };
                                        update();
                                        setInterval(update, 1000);
                                    }
                                }"
                                x-init="initTimer()">

                                <h3 class="lux-font text-xl text-slate-700 mb-6 tracking-wide" x-text="calTitle"></h3>

                                <!-- 달력 카드 -->
                                <div class="bg-white p-5 rounded-2xl border border-sky-100/70 grid grid-cols-7 gap-1 text-center shadow-sm mb-6">
                                    <template x-for="day in ['일','월','화','수','목','금','토']">
                                        <div class="text-[11px] font-bold pb-2" 
                                            :class="day === '일' ? 'text-rose-400' : (day === '토' ? 'text-sky-500' : 'text-slate-400')" 
                                            x-text="day"></div>
                                    </template>
                                    <template x-for="d in calDays">
                                        <div class="h-9 w-9 mx-auto flex items-center justify-center text-xs transition-all"
                                            :class="d.isTarget ? 'bg-sky-400 text-white rounded-full font-bold shadow-md scale-105 ring-2 ring-sky-200' : (d.isSun ? 'text-rose-400' : 'text-slate-600')"
                                            x-text="d.day || ''"></div>
                                    </template>
                                </div>

                                <!-- 카운트다운 박스 -->
                                <div class="p-6 bg-sky-50/50 rounded-2xl border border-sky-100 shadow-sm">
                                    <div class="text-[11px] font-semibold text-sky-500 tracking-widest uppercase mb-4">Winter D-Day</div>
                                    
                                    <div class="grid grid-cols-4 gap-2 max-w-xs mx-auto mb-4">
                                        <div class="bg-white/95 backdrop-blur-sm rounded-xl py-2.5 px-1 border border-sky-100 shadow-xs">
                                            <div class="text-lg font-bold text-slate-800 font-mono tracking-tight" x-text="days"></div>
                                            <div class="text-[9px] text-slate-400 font-semibold mt-0.5">DAYS</div>
                                        </div>
                                        <div class="bg-white/95 backdrop-blur-sm rounded-xl py-2.5 px-1 border border-sky-100 shadow-xs">
                                            <div class="text-lg font-bold text-slate-800 font-mono tracking-tight" x-text="hours"></div>
                                            <div class="text-[9px] text-slate-400 font-semibold mt-0.5">HOUR</div>
                                        </div>
                                        <div class="bg-white/95 backdrop-blur-sm rounded-xl py-2.5 px-1 border border-sky-100 shadow-xs">
                                            <div class="text-lg font-bold text-slate-800 font-mono tracking-tight" x-text="minutes"></div>
                                            <div class="text-[9px] text-slate-400 font-semibold mt-0.5">MIN</div>
                                        </div>
                                        <div class="bg-white/95 backdrop-blur-sm rounded-xl py-2.5 px-1 border border-sky-100 shadow-xs">
                                            <div class="text-lg font-bold text-sky-500 font-mono tracking-tight" x-text="seconds"></div>
                                            <div class="text-[9px] text-slate-400 font-semibold mt-0.5">SEC</div>
                                        </div>
                                    </div>

                                    <div class="text-xs font-semibold text-slate-700 tracking-tight" x-text="dDayText"></div>
                                </div>
                            </div>
                        </template>

                        <!-- 5. Video -->
                        <template x-if="section.id === 'youtube' && data.media.youtube">
                            <div class="px-8 pb-10">
                                <div class="relative w-full aspect-video bg-black rounded-xl shadow-lg overflow-hidden group cursor-pointer"
                                    @click="showVideo=true">
                                    <img :src="`https://i.ytimg.com/vi/${data.media.youtube.trim()}/hqdefault.jpg`"
                                        class="w-full h-full object-cover transition duration-300">
                                    <div class="absolute inset-0 flex items-center justify-center">
                                        <div class="w-12 h-12 bg-white/85 rounded-full flex items-center justify-center text-xl pl-1 shadow-md text-sky-600">
                                            ▶
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </template>

                        <!-- 6. Gallery -->
                        <template x-if="section.id === 'gallery'">
                            <div class="px-4 pb-10">
                                <div class="gal-main mb-2 rounded-xl shadow-lg relative overflow-hidden bg-slate-900"
                                    @click="openLightbox(getGalleryImage(galIdx, 'original'))">
                                    <img :src="getGalleryImage(galIdx, 'original')"
                                        class="w-full h-full object-contain transition-opacity duration-600 ease-in-out"
                                        :class="galleryMainLoaded ? 'opacity-100' : 'opacity-0'"
                                        @load="galleryMainLoaded = true">
                                </div>
                                <div class="grid grid-cols-5 gap-1">
                                    <template x-for="(img, idx) in data.images.gallery.slice(0,30)" :key="idx">
                                        <div class="gal-grid-item rounded-xs"
                                            :style="`background-image: url(${getGalleryImage(idx, 'thumbnail')})`"
                                            :class="galIdx===idx ? 'ring-2 ring-sky-400 shadow-[0_0_12px_rgba(186,230,253,0.9)] z-10' : ''"
                                            @click="selectGalleryImage(idx)"></div>
                                    </template>
                                </div>
                            </div>
                        </template>
                                                    
                        <!-- 7. Phone Section -->
                        <template x-if="section.id === 'phone'">
                            <div class="px-8 pb-10" x-data="{ openContactModal: null }">                                
                                <div class="grid grid-cols-2 gap-3">
                                    <button 
                                        type="button"
                                        @click="openContactModal = 'groom'"
                                        class="py-3 px-3 bg-white hover:bg-sky-50/50 active:scale-[0.98] rounded-xl flex items-center justify-between border border-sky-200/80 shadow-xs transition-all">
                                        <span class="flex items-center gap-1.5 text-xs font-bold text-slate-800">
                                            <span>❄️</span> 신랑측 연락처
                                        </span>
                                        <span class="text-sky-500 text-[10px] font-medium">열기 →</span>
                                    </button>

                                    <button 
                                        type="button"
                                        @click="openContactModal = 'bride'"
                                        class="py-3 px-3 bg-white hover:bg-sky-50/50 active:scale-[0.98] rounded-xl flex items-center justify-between border border-sky-200/80 shadow-xs transition-all">
                                        <span class="flex items-center gap-1.5 text-xs font-bold text-slate-800">
                                            <span>🤍</span> 신부측 연락처
                                        </span>
                                        <span class="text-sky-500 text-[10px] font-medium">열기 →</span>
                                    </button>
                                </div>

                                <!-- 연락처 모달 -->
                                <template x-teleport="body">
                                    <div 
                                        x-show="openContactModal !== null" 
                                        x-transition:enter="transition ease-out duration-200"
                                        x-transition:enter-start="opacity-0"
                                        x-transition:enter-end="opacity-100"
                                        x-transition:leave="transition ease-in duration-150"
                                        x-transition:leave-start="opacity-100"
                                        x-transition:leave-end="opacity-0"
                                        @touchmove.prevent
                                        @wheel.prevent
                                        @click.self="openContactModal = null"
                                        class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm overscroll-contain select-none"
                                        style="display: none; touch-action: none;">

                                        <div 
                                            x-show="openContactModal !== null"
                                            x-transition:enter="transition ease-out duration-200"
                                            x-transition:enter-start="opacity-0 scale-95 translate-y-4"
                                            x-transition:enter-end="opacity-100 scale-100 translate-y-0"
                                            x-transition:leave="transition ease-in duration-150"
                                            x-transition:leave-start="opacity-100 scale-100 translate-y-0"
                                            x-transition:leave-end="opacity-0 scale-95 translate-y-4"
                                            class="w-full max-w-sm bg-white rounded-2xl shadow-2xl p-6 border border-sky-100 relative">
                                            
                                            <div class="flex justify-between items-center mb-5 pb-3 border-b border-slate-100">
                                                <h3 class="text-sm font-bold text-slate-800 flex items-center gap-1.5">
                                                    <span>❄️</span>
                                                    <span x-text="openContactModal === 'groom' ? '신랑측 축하 연락처' : '신부측 축하 연락처'"></span>
                                                </h3>
                                                <button type="button" @click="openContactModal = null" class="text-slate-400 hover:text-slate-600 p-1 text-base leading-none">
                                                    ✕
                                                </button>
                                            </div>

                                            <div 
                                                @touchmove.stop
                                                @wheel.stop
                                                class="space-y-3 max-h-72 overflow-y-auto pr-0.5 overscroll-contain"
                                                style="-webkit-overflow-scrolling: touch; touch-action: pan-y;">
                                                <template x-for="(contact, idx) in (openContactModal === 'groom' ? getAllContacts('groom') : (openContactModal === 'bride' ? getAllContacts('bride') : []))" :key="idx">
                                                    <div class="flex justify-between items-center p-3.5 bg-slate-50 rounded-xl border border-slate-100">

    <!-- Scripts -->
    <script src="minigame.js"></script>
    <script>
        function app() {
            return {
                lang: 'ko', showIntro: true, showVideo: false, lightbox: null,
                showGal: false, galSrc: '', showVid: false,
                data: {}, sortedSections: [],
                calDays: [], calTitle: '', dDay: '',
                bgmPlaying: false, audio: null,
                galIdx: 0,
                galleryMainLoaded: false,
                galleryTimer: null,
                nextImagePreloader: null,
                bbs: [], newPost: { name: '', message: '' },
                join: [], newJoin: { side: 'groom', name: '', count: 1, meal: true },
                copyNotified: false,
                ghToken: '',

                dict: {
                    ko: {
                        names: '초대합니다',
                        calendar: '결혼식 날',
                        youtube: '영상',
                        gallery: '사진 앨범',
                        phone: '연락처',
                        accounts: '마음 전하실 곳',
                        location: '오시는 길',
                        guestbook: '방명록',
                        rsvp: '참석 여부 전달',
                        share: '공유'
                    },
                    en: { names: 'Names', calendar: 'Calendar', of: 'of' }
                },

                async init() {
                    if (sessionStorage.getItem('visited')) this.showIntro = false;

                    const timestamp = new Date().getTime();
                    try {
                        const res = await fetch(`data.json?v=${timestamp}`);
                        if (!res.ok) throw new Error("data.json 로드 실패");
                        const rawData = await res.json();

                        // 1. 토큰 복호화
                        const encToken = rawData.config?.secrets?.encryptedGithubToken;
                        if (encToken && typeof WeddingCrypto !== 'undefined') {
                            try {
                                this.ghToken = await WeddingCrypto.decrypt(encToken);
                            } catch (e) {
                                console.warn('토큰 복호화 실패:', e);
                            }
                        }

                        // 2. 개인정보 전체 일괄 복호화
                        if (typeof WeddingCrypto !== 'undefined') {
                            const fields = ['name', 'name2', 'phone', 'account'];
                            const parentFields = ['father', 'mother', 'fPhone', 'mPhone', 'fAccount', 'mAccount'];

                            for (const side of ['groom', 'bride']) {
                                if (rawData[side]) {
                                    for (const f of fields) {
                                        if (rawData[side][f]) {
                                            rawData[side][f] = await WeddingCrypto.decrypt(rawData[side][f]);
                                        }
                                    }
                                    if (rawData[side].parents) {
                                        for (const pf of parentFields) {
                                            if (rawData[side].parents[pf]) {
                                                rawData[side].parents[pf] = await WeddingCrypto.decrypt(rawData[side].parents[pf]);
                                            }
                                        }
                                    }
                                }
                            }
                        }

                        this.data = rawData;

                        // Kakao Init
                        const kKey = this.data.config?.secrets?.kakaoApiKey || '9b4c537d082fc090a13d6081148c7d83';
                        if (typeof Kakao !== 'undefined' && !Kakao.isInitialized()) {
                            Kakao.init(kKey);
                        }

                        // 섹션 정렬 및 타이틀
                        if (this.data.sections) {
                            this.data.sections.forEach(sec => {
                                sec._canFold = !!sec.isFolded;
                                sec._isFolded = !!sec.isFolded;
                            });
                            this.sortedSections = [...this.data.sections].sort((a, b) => a.order - b.order);

                            if (this.data.groom?.name && this.data.bride?.name) {
                                document.title = `${this.data.groom.name} ♥ ${this.data.bride.name}의 모바일 청첩장`;
                            }
                        }

                        const rsvpIdx = this.data.sections.findIndex(s => s.id === 'rsvp');
                        if (rsvpIdx !== -1) {
                            this.data.sections[rsvpIdx]._canFold = true;
                            this.data.sections[rsvpIdx]._isFolded = true;
                        }

                        this.initCal();
                        this.initSnowEffects(); // ❄️ 겨울 눈꽃 이펙트 실행

                        // 방명록 & 참석자 로드
                        try { this.bbs = await (await fetch(`bbs.json?v=${timestamp}`)).json(); } catch (e) { }
                        try { this.join = await (await fetch(`join.json?v=${timestamp}`)).json(); } catch (e) { }

                        // 갤러리 루프
                        if (this.data.images?.gallery?.length > 0) {
                            this.galIdx = Math.floor(Math.random() * this.data.images.gallery.length);
                            this.preloadNextGalleryImage();
                            this.galleryMainLoaded = true;
                            this.startGalleryLoop();
                        }

                        setTimeout(() => this.initObserver(), 500);

                    } catch (e) {
                        console.error('초기화 에러:', e);
                    }
                },

                closeIntro() {
                    this.showIntro = false;
                    sessionStorage.setItem('visited', 'true');
                    this.initObserver();
                },

                toggleBgm() {
                    if (!this.data.media?.bgm?.length) return;
                    if (!this.audio) {
                        this.audio = new Audio(this.data.media.bgm[0]);
                        this.audio.loop = true;
                    }
                    if (this.bgmPlaying) this.audio.pause();
                    else this.audio.play();
                    this.bgmPlaying = !this.bgmPlaying;
                },

                t(key) { return (this.dict[this.lang] && this.dict[this.lang][key]) || key; },

                initCal() {
                    const dateVal = this.data.config?.weddingDate;
                    if (!dateVal) return;
                    const d = new Date(dateVal);
                    this.calTitle = `${d.getFullYear()}. ${d.getMonth() + 1}`;

                    const y = d.getFullYear(), m = d.getMonth();
                    const firstDay = new Date(y, m, 1).getDay();
                    const lastDate = new Date(y, m + 1, 0).getDate();

                    let arr = [];
                    for (let i = 0; i < firstDay; i++) arr.push({ day: 0 });
                    for (let i = 1; i <= lastDate; i++) {
                        const cur = new Date(y, m, i);
                        arr.push({ day: i, w: cur.getDay(), isTarget: i === d.getDate(), isSun: cur.getDay() === 0 });
                    }
                    this.calDays = arr;

                    this.updateTimer();
                    setInterval(() => this.updateTimer(), 1000);
                },

                updateTimer() {
                    if (!this.data.config?.weddingDate) return;

                    const now = new Date();
                    const localeNow = new Date(now.getTime() + (now.getTimezoneOffset() * 60000) + (9 * 3600000));
                    const target = new Date(this.data.config.weddingDate);
                    const localeTarget = new Date(target.getTime() + (target.getTimezoneOffset() * 60000) + (9 * 3600000));

                    const diff = localeTarget - localeNow;
                    const absDiff = Math.abs(diff);

                    const s = Math.floor(absDiff / 1000) % 60;
                    const m = Math.floor(absDiff / 1000 / 60) % 60;
                    const h = Math.floor(absDiff / 1000 / 60 / 60) % 24;
                    const d = Math.floor(absDiff / 1000 / 60 / 60 / 24);

                    const timeStr = `${h}시간 ${m}분 ${s}초`;
                    const daysStr = d > 0 ? `${d}일 ` : '';
                    const prefix = diff > 0 ? 'D-' : 'D+';
                    const suffix = diff > 0 ? '남음' : '지남';

                    this.dDay = `${prefix}${daysStr}${timeStr} ${suffix}`;
                },

                // ❄️ 아름다운 겨울 눈 내리는 효과 (Winter Snowflakes)
                initSnowEffects() {
                    const canvas = document.getElementById('effect');
                    if (!canvas) return;
                    const ctx = canvas.getContext('2d');

                    const resize = () => {
                        canvas.width = window.innerWidth;
                        canvas.height = window.innerHeight;
                    };
                    window.addEventListener('resize', resize);
                    resize();

                    this.particles = [];

                    class Snowflake {
                        constructor(config = {}) {
                            this.isTouchExplosion = config.isExplosion || false;
                            this.x = config.x !== undefined ? config.x : Math.random() * canvas.width;
                            this.y = config.y !== undefined ? config.y : Math.random() * -canvas.height;
                            this.radius = this.isTouchExplosion ? Math.random() * 3 + 2 : Math.random() * 3 + 1.5;
                            this.speedX = this.isTouchExplosion ? (Math.random() - 0.5) * 8 : (Math.random() - 0.5) * 0.8;
                            this.speedY = this.isTouchExplosion ? (Math.random() - 0.5) * 8 : Math.random() * 1.0 + 0.6;
                            this.sway = Math.random() * Math.PI * 2;
                            this.swaySpeed = 0.02 + Math.random() * 0.02;
                            this.opacity = Math.random() * 0.5 + 0.4;
                            this.life = 1.0;
                        }
                        update() {
                            this.sway += this.swaySpeed;
                            this.x += this.speedX + Math.sin(this.sway) * 0.7;
                            this.y += this.speedY;

                            if (this.isTouchExplosion) {
                                this.life -= 0.03;
                                this.opacity = Math.max(0, this.life);
                            } else if (this.y > canvas.height + 10) {
                                this.y = -10;
                                this.x = Math.random() * canvas.width;
                            }
                        }
                        draw() {
                            ctx.save();
                            ctx.beginPath();
                            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                            ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                            ctx.shadowBlur = 4;
                            ctx.shadowColor = 'rgba(186, 230, 253, 0.8)';
                            ctx.fill();
                            ctx.restore();
                        }
                    }

                    // 눈송이 45개 생성
                    for (let i = 0; i < 45; i++) {
                        this.particles.push(new Snowflake({ y: Math.random() * canvas.height }));
                    }

                    const loop = () => {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        this.particles = this.particles.filter(p => !p.isTouchExplosion || p.life > 0);
                        this.particles.forEach(p => { p.update(); p.draw(); });
                        requestAnimationFrame(loop);
                    };
                    loop();

                    this._createSnowExplosion = (x, y) => {
                        for (let i = 0; i < 16; i++) {
                            this.particles.push(new Snowflake({ isExplosion: true, x, y }));
                        }
                    };
                },

                handleMouseMove(e) {},
                handleMouseDown(e) { if (this._createSnowExplosion) this._createSnowExplosion(e.clientX, e.clientY); },
                handleTouchStart(e) { if (this._createSnowExplosion) this._createSnowExplosion(e.touches[0].clientX, e.touches[0].clientY); },

                initMap() {
                    const key = this.data.config?.secrets?.kakaoApiKey || '9b4c537d082fc090a13d6081148c7d83';
                    const container = document.getElementById('map');
                    if (!container) return;

                    const drawMap = (lat, lng) => {
                        const coords = new kakao.maps.LatLng(lat, lng);
                        const options = { center: coords, level: 3 };
                        const map = new kakao.maps.Map(container, options);
                        new kakao.maps.Marker({ position: coords, map: map });
                        setTimeout(() => map.relayout(), 500);
                        setTimeout(() => map.setCenter(coords), 600);
                    };

                    const startEngine = () => {
                        const venue = this.data.config?.venue;
                        if (!venue) return;
                        if (venue.lat && venue.lng) {
                            return drawMap(venue.lat, venue.lng);
                        }

                        const geocoder = new kakao.maps.services.Geocoder();
                        geocoder.addressSearch(venue.address, (result, status) => {
                            if (status === kakao.maps.services.Status.OK) {
                                drawMap(result[0].y, result[0].x);
                            } else {
                                drawMap(37.4819407, 126.7984955);
                            }
                        });
                    };

                    if (typeof kakao !== 'undefined' && kakao.maps && kakao.maps.services) {
                        startEngine();
                    } else {
                        if (window.kakaoMapLoading) return;
                        window.kakaoMapLoading = true;

                        const script = document.createElement('script');
                        script.type = 'text/javascript';
                        script.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${key}&libraries=services&autoload=false`;
                        script.onload = () => {
                            kakao.maps.load(() => {
                                window.kakaoMapLoading = false;
                                startEngine();
                            });
                        };
                        document.head.appendChild(script);
                    }
                },

                initObserver() {
                    const obs = new IntersectionObserver(entries => {
                        entries.forEach(e => {
                            if (e.isIntersecting) e.target.classList.add('active');
                        });
                    }, { threshold: 0.1 });
                    document.querySelectorAll('.section-wrap').forEach(el => obs.observe(el));
                },

                getGalleryImage(idx, type = 'thumbnail') {
                    if (!this.data.images || !this.data.images.gallery) return '';
                    const img = this.data.images.gallery[idx];
                    if (!img) return '';

                    if (typeof img === 'object' && img.thumbnail && img.original) {
                        return type === 'original' ? img.original : img.thumbnail;
                    }
                    return img;
                },

                openLightbox(src) {
                    if (src) this.lightbox = src;
                },

                selectGalleryImage(idx) {
                    this.stopGalleryLoop();
                    this.galleryMainLoaded = false;
                    this.galIdx = idx;
                    this.preloadNextGalleryImage();
                    this.startGalleryLoop();
                },

                startGalleryLoop() {
                    this.stopGalleryLoop();
                    this.galleryTimer = setInterval(() => {
                        if (this.data.images?.gallery?.length) {
                            this.galleryMainLoaded = false;
                            setTimeout(() => {
                                this.galIdx = (this.galIdx + 1) % this.data.images.gallery.length;
                                this.preloadNextGalleryImage();
                            }, 600);
                        }
                    }, 6000);
                },

                stopGalleryLoop() {
                    if (this.galleryTimer) {
                        clearInterval(this.galleryTimer);
                        this.galleryTimer = null;
                    }
                },

                preloadNextGalleryImage() {
                    if (!this.data.images?.gallery?.length) return;
                    const nextIdx = (this.galIdx + 1) % this.data.images.gallery.length;
                    const nextImgUrl = this.getGalleryImage(nextIdx, 'original');
                    if (nextImgUrl) {
                        this.nextImagePreloader = new Image();
                        this.nextImagePreloader.src = nextImgUrl;
                    }
                },

                copy(txt) {
                    if (navigator.clipboard && window.isSecureContext) {
                        navigator.clipboard.writeText(txt);
                    } else {
                        const textArea = document.createElement("textarea");
                        textArea.value = txt;
                        textArea.style.position = "fixed";
                        textArea.style.left = "-999999px";
                        document.body.appendChild(textArea);
                        textArea.focus();
                        textArea.select();
                        try { document.execCommand('copy'); } catch (e) { }
                        textArea.remove();
                    }
                },

                // 방명록 등록
                async saveBbs() {
                    if (!this.newPost.name || !this.newPost.message) return alert('성함과 메시지를 입력해주세요.');
                    const post = { ...this.newPost, date: new Date().toISOString() };
                    const newList = [post, ...this.bbs];
                    if (await this.pushToGithub('bbs.json', newList)) {
                        this.bbs = newList;
                        this.newPost = { name: '', message: '' };
                        alert('축하 메시지가 등록되었습니다! 따뜻한 마음에 감사드립니다.');
                    }
                },

                // 참석 여부 등록
                async saveJoin() {
                    if (!this.newJoin.name) return alert('성함을 입력해주세요.');
                    const entry = { ...this.newJoin, date: new Date().toISOString() };
                    const currentList = this.join || [];
                    const newList = [...currentList, entry];
                    if (await this.pushToGithub('join.json', newList)) {
                        this.join = newList;
                        this.newJoin = { side: 'groom', name: '', count: 1, meal: true };
                        alert('참석 정보가 안전하게 전달되었습니다. 감사합니다.');
                    }
                },

                // 깃허브 API 커밋
                async pushToGithub(filename, payloadData) {
                    const token = this.ghToken || localStorage.getItem('ghToken') || this.data.config?.secrets?.githubToken;
                    if (!token) {
                        alert('서버와 보안 연결에 실패했습니다. 관리자에게 문의해주세요.');
                        return false;
                    }

                    const content = btoa(unescape(encodeURIComponent(JSON.stringify(payloadData, null, 2))));
                    try {
                        const r = await fetch(`https://api.github.com/repos/jd-commit-us/wedding-firstpage/contents/${filename}`, {
                            headers: { 'Authorization': `token ${token}` }
                        });
                        const d = await r.json();
                        const sha = d.sha;

                        const res = await fetch(`https://api.github.com/repos/jd-commit-us/wedding-firstpage/contents/${filename}`, {
                            method: 'PUT',
                            headers: { 
                                'Authorization': `token ${token}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ message: `update ${filename}`, content, sha })
                        });
                        return res.ok;
                    } catch (e) {
                        console.error(e);
                        alert('등록 중 통신 오류가 발생했습니다.');
                        return false;
                    }
                },

                getAllAccounts(type) {
                    if (!this.data || !this.data[type]) return [];
                    const person = this.data[type];
                    const list = [];

                    if (person.account) {
                        list.push({
                            relation: type === 'groom' ? '신랑' : '신부',
                            name: person.name,
                            bank: person.bank || '은행',
                            num: person.account
                        });
                    }
                    if (person.parents?.fAccount) {
                        list.push({
                            relation: '아버지',
                            name: person.parents.father,
                            bank: person.parents.fBank || '은행',
                            num: person.parents.fAccount
                        });
                    }
                    if (person.parents?.mAccount) {
                        list.push({
                            relation: '어머니',
                            name: person.parents.mother,
                            bank: person.parents.mBank || '은행',
                            num: person.parents.mAccount
                        });
                    }
                    return list;
                },

                copyAccount(acc) {
                    const textToCopy = `${acc.bank} ${acc.num}`;
                    this.copy(acc.num);
                    alert(`${acc.name}님의 계좌번호가 복사되었습니다.\n(${textToCopy})`);
                },

                getAllContacts(type) {
                    if (!this.data || !this.data[type]) return [];
                    const person = this.data[type];
                    const list = [];

                    if (person.phone) {
                        list.push({
                            relation: type === 'groom' ? '신랑' : '신부',
                            name: person.name || (type === 'groom' ? '신랑' : '신부'),
                            phone: person.phone
                        });
                    }
                    if (person.parents && person.parents.fPhone) {
                        list.push({
                            relation: '아버지',
                            name: person.parents.father || '아버지',
                            phone: person.parents.fPhone
                        });
                    }
                    if (person.parents && person.parents.mPhone) {
                        list.push({
                            relation: '어머니',
                            name: person.parents.mother || '어머니',
                            phone: person.parents.mPhone
                        });
                    }
                    return list;
                },

                shareKakao() {
                    if (typeof Kakao !== 'undefined' && Kakao.isInitialized()) {
                        try {
                            Kakao.Share.sendDefault({
                                objectType: 'feed',
                                content: {
                                    title: `${this.data.groom?.name} ♥ ${this.data.bride?.name}의 결혼식에 초대합니다!`,
                                    description: (this.data.config?.venue?.name || '') + ' ' + (this.data.config?.weddingDate || ''),
                                    imageUrl: this.data.images?.main || 'https://jd-commit-us.github.io/wedding-firstpage/local/images/og/thumbnail.png',
                                    link: { mobileWebUrl: window.location.href, webUrl: window.location.href },
                                },
                                buttons: [{ title: '모바일 청첩장 보기', link: { mobileWebUrl: window.location.href, webUrl: window.location.href } }],
                            });
                        } catch (e) {
                            this.copyLink();
                        }
                    } else {
                        this.copyLink();
                    }
                },

                shareSns(type) {
                    const url = window.location.href;
                    const encodedUrl = encodeURIComponent(url);
                    const title = `${this.data.groom?.name} ♥ ${this.data.bride?.name}의 결혼식에 초대합니다!`;
                    const encodedTitle = encodeURIComponent(title);

                    let appUrl = '';
                    let webUrl = '';

                    switch (type) {
                        case 'facebook':
                            appUrl = `fb://facewebmodal/f?href=${encodedUrl}`;
                            webUrl = `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`;
                            break;
                        case 'x':
                            appUrl = `twitter://post?message=${encodedTitle}%20${encodedUrl}`;
                            webUrl = `https://twitter.com/intent/tweet?url=${encodedUrl}&text=${encodedTitle}`;
                            break;
                        case 'line':
                            appUrl = `line://msg/text/${encodedTitle}%20${encodedUrl}`;
                            webUrl = `https://social-plugins.line.me/lineit/share?url=${encodedUrl}`;
                            break;
                        case 'telegram':
                            appUrl = `tg://msg_url?url=${encodedUrl}&text=${encodedTitle}`;
                            webUrl = `https://t.me/share/url?url=${encodedUrl}&text=${encodedTitle}`;
                            break;
                    }

                    if (appUrl) {
                        const start = Date.now();
                        window.location.href = appUrl;
                        setTimeout(() => {
                            if (Date.now() - start < 2000) {
                                window.open(webUrl, '_blank');
                            }
                        }, 1500);
                    } else if (webUrl) {
                        window.open(webUrl, '_blank');
                    }
                },

                copyLink() {
                    this.copy(window.location.href);
                    if (!this.copyNotified) {
                        alert('클립 보드에 주소가 저장되었습니다.');
                        this.copyNotified = true;
                    }
                }
            }
        }
    </script>
